[workspace]
members = [
    "crates/app",
    "crates/canvas",
    "crates/cli",
    "crates/workspace-session",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "clipboard", "persistence"] }
muda = { version = "=0.20.0", default-features = false }
raw-window-handle = "=0.6.2"
rfd = { version = "=0.17.2", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
