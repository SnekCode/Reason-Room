[package]
name = "infinite-note-canvas"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# The browser entry point lives beside the shared application code. The
# desktop launcher remains a thin native-only binary below.
path = "src/main.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "infinite-note-canvas"
path = "src/desktop_main.rs"

[dependencies]
eframe.workspace = true
infinite-note-canvas-canvas = { path = "../canvas" }
infinite-note-canvas-workspace-session = { path = "../workspace-session" }
serde.workspace = true
rfd.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = { version = "=0.3.106", features = ["HtmlCanvasElement"] }
